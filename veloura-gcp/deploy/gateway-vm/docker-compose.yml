services:
  api-gateway:
    build: ../../backend/api-gateway
    container_name: api-gateway
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      PRODUCT_SERVICE_URL: http://${PRODUCT_IP}:5001
      CART_SERVICE_URL: http://${CART_IP}:5002
      ORDER_SERVICE_URL: http://${ORDER_IP}:5003
    restart: unless-stopped
