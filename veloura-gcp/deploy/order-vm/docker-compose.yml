services:
  order-db:
    image: mongo:7
    container_name: order-db
    ports:
      - "27017:27017"
    volumes:
      - order_db_data:/data/db
    restart: unless-stopped

  order-service:
    build: ../../backend/order-service
    container_name: order-service
    ports:
      - "5003:5003"
    environment:
      PORT: 5003
      MONGODB_URI: mongodb://order-db:27017/order_db
      CART_SERVICE_URL: http://${CART_IP}:5002
    depends_on:
      - order-db
    restart: unless-stopped

volumes:
  order_db_data:
